plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kalenjohnson.chronoduo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kalenjohnson.chronoduo'
        minSdk 26
        targetSdk 35
        // CI passes -PversionCode=<run number> -PversionName=<tag> so every
        // published APK installs over the previous one.
        versionCode (project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1)
        versionName (project.hasProperty('versionName') ? project.versionName : '0.1')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        ndk { abiFilters 'arm64-v8a' }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    // Release signing comes from the environment (see .github/workflows/build.yml).
    // Without CHRONODUO_KEYSTORE the release build is debug-signed so it still installs.
    def keystorePath = System.getenv('CHRONODUO_KEYSTORE')
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('CHRONODUO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CHRONODUO_KEY_ALIAS')
                keyPassword System.getenv('CHRONODUO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        // vendored cocos2d-x 3.14.1 sources trip many modern lint checks
        abortOnError false
    }

    testOptions {
        unitTests {
            // ModManager's Log.w/Log.i calls (font decrypt warnings, .group/
            // .source write failures, etc.) would otherwise throw against
            // the unmocked android.jar stub every JVM unit test runs
            // against -- have them return their default (no-op) instead.
            returnDefaultValues = true
        }
    }
}

dependencies {
    // required by vendored Cocos2dxDownloader (the engine FindClass()es it at nativeInit)
    implementation 'com.loopj.android:android-async-http:1.4.9'
    // 7z extraction for mod archives (ModManager#unSevenZInto) -- xz is
    // Commons Compress's own <optional>true</optional> LZMA/LZMA2 dependency,
    // so it must be declared explicitly (Gradle doesn't pull Maven "optional"
    // deps transitively); pinned to the version commons-compress 1.28.0 was
    // built/tested against.
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'
    // RAR4 extraction (ModManager#unRarInto). junrar declares slf4j-api as a
    // plain runtime dependency so Gradle pulls it transitively anyway, but
    // it's pinned explicitly here since older junrar releases shipped it as
    // provided/optional and silently dropping it is a runtime-only
    // NoClassDefFoundError that assembleDebug can't catch.
    implementation 'com.github.junrar:junrar:8.1.1'
    implementation 'org.slf4j:slf4j-api:2.0.19'
    // JVM unit tests (app/src/test/java) -- pure-Java classes like ModManager
    // are deliberately Android-dependency-free so they can run here without
    // an emulator/instrumentation.
    testImplementation 'junit:junit:4.13.2'
    // ArchiveOverlayImporterTest builds a synthetic 7z fixture with
    // Commons Compress's SevenZOutputFile.
    testImplementation 'org.apache.commons:commons-compress:1.28.0'
    testImplementation 'org.tukaani:xz:1.10'
}
