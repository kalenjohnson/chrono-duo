plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kalenjohnson.chronoduo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kalenjohnson.chronoduo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        ndk { abiFilters 'arm64-v8a' }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    lint {
        // vendored cocos2d-x 3.14.1 sources trip many modern lint checks
        abortOnError false
    }
}

dependencies {
    // required by vendored Cocos2dxDownloader (the engine FindClass()es it at nativeInit)
    implementation 'com.loopj.android:android-async-http:1.4.9'
}
