plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kalenjohnson.chronoduo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kalenjohnson.chronoduo'
        minSdk 26
        targetSdk 35
        // CI passes -PversionCode=<run number> -PversionName=<tag> so every
        // published APK installs over the previous one.
        versionCode (project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1)
        versionName (project.hasProperty('versionName') ? project.versionName : '0.1')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        ndk { abiFilters 'arm64-v8a' }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    // Release signing comes from the environment (see .github/workflows/build.yml).
    // Without CHRONODUO_KEYSTORE the release build is debug-signed so it still installs.
    def keystorePath = System.getenv('CHRONODUO_KEYSTORE')
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('CHRONODUO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CHRONODUO_KEY_ALIAS')
                keyPassword System.getenv('CHRONODUO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        // vendored cocos2d-x 3.14.1 sources trip many modern lint checks
        abortOnError false
    }

    testOptions {
        unitTests {
            // ModManager's Log.w/Log.i calls (font decrypt warnings, .group/
            // .source write failures, etc.) would otherwise throw against
            // the unmocked android.jar stub every JVM unit test runs
            // against -- have them return their default (no-op) instead.
            returnDefaultValues = true
        }
    }
}

dependencies {
    // required by vendored Cocos2dxDownloader (the engine FindClass()es it at nativeInit)
    implementation 'com.loopj.android:android-async-http:1.4.9'
    // JVM unit tests (app/src/test/java) -- pure-Java classes like ModManager
    // are deliberately Android-dependency-free so they can run here without
    // an emulator/instrumentation.
    testImplementation 'junit:junit:4.13.2'
}
