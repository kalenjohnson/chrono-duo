name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.1-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CHRONODUO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          CHRONODUO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CHRONODUO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CHRONODUO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # -D overrides the org.gradle.java.home pin in gradle.properties (a local dev path)
        run: |
          ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" \
            -PversionCode="$GITHUB_RUN_NUMBER" -PversionName="${{ steps.ver.outputs.name }}" \
            assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "ChronoDuo-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: ChronoDuo-${{ steps.ver.outputs.name }}
          path: ChronoDuo-*.apk

      # Every push to main refreshes the rolling "latest" pre-release.
      - name: Publish rolling latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body: |
            Automatic build of `main` at ${{ github.sha }}.
            Installs over any previous build (versionCode ${{ github.run_number }}).
          files: ChronoDuo-*.apk

      # Tags like v0.2 get a proper versioned release. The description comes
      # from docs/releases/v<version>.md at the tagged commit (written by
      # hand before tagging); GitHub's generated changelog is appended
      # below it. A missing file just leaves the generated part.
      - name: Collect release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          f="docs/releases/v${{ steps.ver.outputs.name }}.md"
          [ -f "$f" ] || printf '' > "$RUNNER_TEMP/empty.md"
          echo "path=$([ -f "$f" ] && echo "$f" || echo "$RUNNER_TEMP/empty.md")" >> "$GITHUB_OUTPUT"
        id: notes
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ChronoDuo ${{ steps.ver.outputs.name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          append_body: true
          files: ChronoDuo-*.apk
